<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html class 2</title>
    <link rel="shortcut icon" href="robo.png" type="image/x-icon">
</head>
<body>
    
    <h1>HTML FORM</h1>
    <hr>

    <form action="./controller.html">

        <label for="f-name">First name:</label>
        <input id="f-name" type="text" placeholder="Enter your first name">

        <br>
        <br>

        <label for="l-name">Last name:</label>
        <input id="l-name" type="text" placeholder="Enter your last name">

        <br>
        <br>

        <label for="email">Email:</label>
        <input required id="email" type="email" placeholder="Email Here">

        <br>
        <br>

        <label for="password">Password:</label>
        <input id="password" type="password" placeholder="Enter your password">

        <br>
        <br>

        <label for="p-number">Phone Number:</label>
        <input id="p-number" type="text" placeholder="Enter your number">

        <br>
        <br>

        <label for="birth">Date of Birth:</label>
        <input id="birth" type="date">

        <br>
        <br>

        <label for="time">Set Time:</label>
        <input id="time" type="time">

        <br>
        <br>

        <label for="date-time">Date & Time</label>
        <input id="date-time" type="datetime-local">

        <br>
        <br>

        <label for="institute">Institute name:</label>
        <input id="institute" type="text" placeholder="Enter your institute name">

        <br>
        <br>

        <label for="details">Details:</label> <br>
        <textarea cols="50" rows="5" name="" id="" placeholder="Details please..."></textarea>

        <br>
        <br>

        <label for="">Select your division:</label>
        <select name="" id="">
            <option disabled selected>--select your division--</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Chattogram">Chattogram</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Khulna">Khulna</option>
            <option value="Barishal">Barishal</option>
            <option value="Sylhet">Sylhet</option>
            <option value="Rangpur">Rangpur</option>
            <option value="Mymensingh">Mymensingh</option>
        </select>

        <br>
        <br>

        <label for="profile-img"><img height="100px" src="./placeholder.avif" alt=""></label>
        <input hidden id="profile-img" type="file" accept=".jpeg">

        <br>
        <br>

        <label for="color">Choose color:</label>
        <input id="color" type="color">

        <br>
        <br>

        <label for="">Gender:</label>
        <input name="gender" type="radio">
        <label for="man">Man</label>

        <input name="gender" type="radio">
        <label for="woman">Woman</label>

        <br>
        <br>    
        <label for="">Favourite Car:</label>


        <label for="">Bugatti</label>
        <input type="checkbox">

        <label for="">Lamborghini</label>
        <input type="checkbox">

        <label for="">Mazda</label>
        <input type="checkbox">

        <br>
        <br>

        <label for="">Favourite Games:</label>

        <label for="">Football</label>
        <input type="checkbox">

        <label for="">Cricket</label>
        <input type="checkbox">

        <label for="">Online games</label>
        <input type="checkbox">

        <br>
        <br>

        <label for="">Favourite sports Team :</label>
        <select name="" id="">
            <option disabled selected>--Select Your Favourite Team--</option>
            <option value="TEC">Ban</option>
            <option value="X2">Ind</option>
            <option value="ELC">Aus</option>
            <option value="Top1">Eng</option>
            
        </select>

        <br>
        <br>

        <button>Submit</button>
        








    </form>

</body>
</html>
